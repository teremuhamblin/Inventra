name: Inventra CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations (check only)
        run: |
          source .venv/bin/activate
          python backend/manage.py migrate --check

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Lint code (black + isort)
        run: |
          source .venv/bin/activate
          black --check .
          isort --check-only .
